name: Análisis diario de mercado

on:
  schedule:
    # Días hábiles: 21:30 UTC = 5:30pm ET (15min post-cierre NYSE) = 18:30 ART
    - cron: '30 21 * * 1-5'
    # Fin de semana: sábado y domingo a las 20:00 UTC = 17:00 ART (captura noticias del fin de semana)
    - cron: '0 20 * * 6,0'
  workflow_dispatch:  # permite correr manualmente desde GitHub

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr análisis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
        run: python scripts/ci_analysis.py

      - name: Commitear resultado
        run: |
          git config user.name "finwatch-bot"
          git config user.email "finwatch-bot@users.noreply.github.com"
          git add config/ci_analysis.json
          git diff --staged --quiet || git commit -m "ci: análisis automático $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
